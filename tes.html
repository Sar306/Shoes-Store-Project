<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .center-nav form {
      display: flex;
    }

    .center-nav input {
      flex: 10%;
      min-width: 150px;
      padding: 10px 16px;
      font-size: 14px;
      border: 1px solid rgb(204, 204, 204);
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    .center-nav button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      background: rgb(17, 17, 17);
      color: rgb(255, 255, 255);
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="center-nav">
    <form action="">
      <input type="text" placeholder="KETIK AJA">
      <button type="submit">CARI</button>
    </form>
  </div>
</body>
</html>
