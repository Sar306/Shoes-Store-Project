<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sepatu Running Pro - StepUp Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="produk.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo">STEP UP</a>
    <a href="cart.html">Keranjang</a>
  </header>

  <main class="halaman">
    <a href="men.html" class="kembali">&lsaquo; Kembali</a>
    <div class="produk">
      <div class="foto">
        <img src="images/running-pro.jpg" alt="Sepatu Running Pro">
      </div>

      <div class="info">
        <p class="kategori">Pria</p>
        <h1>Sepatu Running Pro</h1>
        <p class="harga">Rp 450.000</p>
        <p class="deskripsi">
          Sepatu lari ringan dengan sol empuk dan bagian atas berbahan mesh
          yang adem dipakai seharian.
        </p>

        <form action="#">
          <h2>Ukuran</h2>
          <div class="grup">
            <label class="opsi"><input type="radio" name="ukuran" value="39"><span>39</span></label>
            <label class="opsi"><input type="radio" name="ukuran" value="40"><span>40</span></label>
            <label class="opsi"><input type="radio" name="ukuran" value="41"><span>41</span></label>
            <label class="opsi"><input type="radio" name="ukuran" value="42"><span>42</span></label>
            <label class="opsi"><input type="radio" name="ukuran" value="43"><span>43</span></label>
            <label class="opsi"><input type="radio" name="ukuran" value="44"><span>44</span></label>
          </div>

          <h2>Warna</h2>
          <div class="grup">
            <label class="opsi"><input type="radio" name="warna" value="Hitam" checked><span>Hitam</span></label>
            <label class="opsi"><input type="radio" name="warna" value="Putih"><span>Putih</span></label>
          </div>

          <h2>Jumlah</h2>
          <input type="number" class="jumlah" name="jumlah" value="1" min="1" max="10">

          <div class="aksi">
            <button type="button" class="btn btn-garis">Tambah ke Keranjang</button>
            <button type="button" class="btn btn-isi">Beli Sekarang</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
